version: 2

multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: 'weekly'

updates:
  - package-ecosystem: 'composer'
    directory: '/'
    patterns:
      - '*'
    multi-ecosystem-group: 'dependencies'

  - package-ecosystem: 'github-actions'
    directory: '/'
    patterns:
      - '*'
    multi-ecosystem-group: 'dependencies'
